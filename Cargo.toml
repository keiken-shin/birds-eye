[package]
name = "birds-eye"
version = "0.3.0"
edition = "2021"
description = "Native disk space intelligence platform scanner core"
license = "MIT"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1"
trash = "3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }

[target.'cfg(windows)'.dependencies]
# Restart Manager: name the processes holding a locked file.
# Storage.FileSystem: enumerate fixed drives and their capacity.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_RestartManager", "Win32_Storage_FileSystem", "Win32_Security"] }

[lib]
name = "birds_eye"
path = "src/lib.rs"

[[bin]]
name = "birds-eye-scan"
path = "src/main.rs"

# Builds the benchmark corpora. Not shipped in the app; it exists so scale
# claims can be measured rather than reasoned about. See issue #60.
[[bin]]
name = "birds-eye-bench-corpus"
path = "src/bin/bench_corpus.rs"

# The gate that stops the warning count creeping back up. It was 24 before
# anyone counted, which is how a real warning hides. Denying at the crate level
# means every build gets the gate, rather than only whoever remembers the flag.
#
# A toolchain upgrade that adds a lint will fail the build until it is dealt
# with. That is the point, and it is one commit to fix.
[lints.clippy]
all = { level = "deny", priority = -1 }

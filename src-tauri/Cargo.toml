[package]
name = "birds-eye-desktop"
version = "0.3.0"
edition = "2021"
description = "Birds Eye desktop shell"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
birds-eye = { path = ".." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

# Same gate as the core crate: a warning count that nobody counts is where a
# real warning hides.
[lints.clippy]
all = { level = "deny", priority = -1 }
